name: Build and publish Spectrum R.E.P.O. Mod

on:
  push:
    branches: [main, "testing/**", "feature/**"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_nexus:
        description: "Upload this verified build to the existing Nexus Mods file. Test branches never publish automatically."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repo-mod-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.verify.outputs.version }}
      package: ${{ steps.verify.outputs.package }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version_number"])')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Spectrum R.E.P.O. Mod $VERSION"

      - name: Restore dependencies
        run: dotnet restore ./src/SpectrumRepoMod.csproj

      - name: Build R.E.P.O. integration plugin
        run: dotnet build ./src/SpectrumRepoMod.csproj --configuration Release --no-restore

      - name: Verify explicit runtime compilation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EnableDefaultCompileItems>false' src/SpectrumRepoMod.csproj
          grep -q '<Compile Include="Runtime/RepoPairingClient.cs"' src/SpectrumRepoMod.csproj
          grep -q '<Compile Include="Runtime/RepoGatewayClient.cs"' src/SpectrumRepoMod.csproj
          grep -q '<Compile Include="Runtime/RepoCatalogBuilder.cs"' src/SpectrumRepoMod.csproj
          grep -q '<Compile Include="Runtime/RepoSpawnExecutor.cs"' src/SpectrumRepoMod.csproj
          grep -q 'PluginVersion = "0.6.1"' src/Plugin.cs
          if grep -q '<Compile Include="Rewards/' src/SpectrumRepoMod.csproj; then
            echo "::error::Unexpected reward runtime source was added to the R.E.P.O. test build."
            exit 1
          fi

      - name: Assemble and verify DLL-only install ZIP
        id: verify
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          stage="dist/Spectrum_REPO_Mod"
          test -f "$stage/SpectrumRepoMod.dll"
          test ! -e "$stage/manifest.json"
          test ! -e "$stage/README.md"
          test ! -e "$stage/CHANGELOG.md"
          test ! -e "$stage/icon.png"
          test ! -d "$stage/BepInEx"
          stage_count="$(find "$stage" -mindepth 1 -maxdepth 1 | wc -l)"
          test "$stage_count" -eq 1
          package="dist/Spectrum_REPO_Mod-${PACKAGE_VERSION}.zip"
          (cd "$stage" && zip -q "../Spectrum_REPO_Mod-${PACKAGE_VERSION}.zip" SpectrumRepoMod.dll)
          listing="$(mktemp)"
          unzip -Z1 "$package" > "$listing"
          test "$(wc -l < "$listing")" -eq 1
          grep -qx 'SpectrumRepoMod.dll' "$listing"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Verified DLL-only Vortex install package: $package"

      - name: Upload installable package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum_REPO_Mod-${{ steps.verify.outputs.version }}
          path: ${{ steps.verify.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified build to Nexus Mods
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_nexus) }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Validate Nexus publishing inputs
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          test -n "$NEXUS_API_KEY" || { echo "::error::Missing repository secret NEXUSMODS_API_KEY."; exit 1; }

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: Spectrum_REPO_Mod-${{ needs.build.outputs.version }}
          path: ./publish-package

      - name: Upload version to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "8454957"
          filename: ./publish-package/Spectrum_REPO_Mod-${{ needs.build.outputs.version }}.zip
          version: ${{ needs.build.outputs.version }}
          display_name: Spectrum R.E.P.O. Mod
          update_mod_version: true

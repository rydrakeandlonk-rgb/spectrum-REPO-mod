name: Build and publish Thunderstore package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read package version
        id: package_meta
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version_number"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Spectrum_REPO_Mod $VERSION"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./src/SpectrumRepoMod.csproj

      - name: Build plugin
        run: dotnet build ./src/SpectrumRepoMod.csproj --configuration Release --no-restore

      - name: Run selection tests
        run: dotnet test ./tests/SpectrumRepoMod.Tests.csproj --configuration Release

      - name: Assemble Thunderstore ZIP
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package_meta.outputs.version }}
        run: |
          set -euo pipefail
          test -f dist/Spectrum_REPO_Mod/BepInEx/plugins/SpectrumRepoMod.dll
          python3 - <<'PY'
          import json, os
          path = "dist/Spectrum_REPO_Mod/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version_number"] = os.environ["PACKAGE_VERSION"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cd dist/Spectrum_REPO_Mod
          zip -r "../Spectrum_REPO_Mod-${PACKAGE_VERSION}.zip" .

      - name: Upload installable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum_REPO_Mod-${{ steps.package_meta.outputs.version }}
          path: dist/Spectrum_REPO_Mod-${{ steps.package_meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out package metadata
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: Spectrum_REPO_Mod-${{ needs.build.outputs.version }}
          path: ./publish-package

      - name: Configure Thunderstore CLI
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > thunderstore.toml <<EOF
          [config]
          schemaVersion = "0.0.1"

          [package]
          namespace = "SpectrumStreamers"
          name = "Spectrum_REPO_Mod"
          versionNumber = "$PACKAGE_VERSION"
          description = "Early host-side testing integration for Spectrum R.E.P.O. reward spawns. Twitch redemptions are not enabled yet."
          websiteUrl = "https://github.com/rydrakeandlonk-rgb/spectrum-REPO-mod"
          containsNsfwContent = false

          [publish]
          repository = "https://thunderstore.io"
          communities = ["repo"]

          [publish.categories]
          repo = ["mods"]
          EOF
          dotnet tool install --global tcli

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tcli publish --file "./publish-package/Spectrum_REPO_Mod-${PACKAGE_VERSION}.zip" --token "$TCLI_AUTH_TOKEN" --config-path "./thunderstore.toml"

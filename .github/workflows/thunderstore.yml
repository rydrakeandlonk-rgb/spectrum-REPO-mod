name: Build and publish Thunderstore package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read package version
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version_number"])')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Spectrum_REPO_Mod version $VERSION"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./src/SpectrumRepoMod.csproj

      - name: Build plugin
        run: dotnet build ./src/SpectrumRepoMod.csproj --configuration Release --no-restore

      - name: Run selection tests
        run: dotnet test ./tests/SpectrumRepoMod.Tests.csproj --configuration Release

      - name: Assemble Thunderstore ZIP
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          set -euo pipefail
          test -f dist/Spectrum_REPO_Mod/BepInEx/plugins/SpectrumRepoMod.dll
          python3 - <<'PY'
          import json, os
          path = "dist/Spectrum_REPO_Mod/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version_number"] = os.environ["PACKAGE_VERSION"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\\n")
          PY
          cd dist/Spectrum_REPO_Mod
          zip -r "../Spectrum_REPO_Mod-${PACKAGE_VERSION}.zip" .

      - name: Upload installable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum_REPO_Mod-${{ steps.package_version.outputs.value }}
          path: dist/Spectrum_REPO_Mod-${{ steps.package_version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14

  release-check:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether the manifest version changed
        id: compare
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No previous commit available; skipping automatic publish."
            exit 0
          fi
          OLD_VERSION="$(git show "${BEFORE_SHA}:manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version_number"])')"
          NEW_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version_number"])')"
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Thunderstore version changed: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Thunderstore version unchanged ($NEW_VERSION); build only."
          fi

  publish:
    if: ${{ github.event_name == 'push' && needs.release-check.outputs.version_changed == 'true' }}
    needs: [build, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Validate publishing credentials
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          test -n "$TCLI_AUTH_TOKEN" || { echo "Missing repository secret TCLI_AUTH_TOKEN."; exit 1; }

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: Spectrum_REPO_Mod-${{ needs.build.outputs.package_version }}
          path: ./publish-package

      - name: Configure Thunderstore CLI
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          cat > thunderstore.toml <<EOF
          [config]
          schemaVersion = "0.0.1"

          [package]
          namespace = "SpectrumStreamers"
          name = "Spectrum_REPO_Mod"
          versionNumber = "$PACKAGE_VERSION"
          description = "Early host-side testing integration for Spectrum R.E.P.O. reward spawns. Twitch redemptions are not enabled yet."
          websiteUrl = "https://github.com/rydrakeandlonk-rgb/spectrum-REPO-mod"
          containsNsfwContent = false

          [publish]
          repository = "https://thunderstore.io"
          communities = ["repo"]

          [publish.categories]
          repo = ["mods"]
          EOF
          dotnet tool install --global tcli

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          tcli publish --file "./publish-package/Spectrum_REPO_Mod-${PACKAGE_VERSION}.zip" --token "$TCLI_AUTH_TOKEN" --config-path "./thunderstore.toml"
